/* Paleta Meridian Digital (tokens de meridian-digital-v8.html) */

<script>
const C={bg:'#03071F',fg:'#FFFFFF',mut:'#A3ADC2',cy:'#DFE5FF',bl:'#0428CB',sky:'#7FB0FF'};
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const k=(t,a,d=.45)=>E(seg(t,a,a+d));
const lerp=(a,b,x)=>a+(b-a)*x;
function mk(parent,css='',html='',cls='ab'){const e=document.createElement('div');e.className=cls;e.style.cssText=css;e.innerHTML=html;parent.appendChild(e);return e}
const updaters=[];const on=f=>updaters.push(f);
let TL,LINES;
/* ---------- sincronía: cada evento se ancla a una palabra hablada (timeline.json · words) ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function Wt(ref){const i0=ref.indexOf(':'),id=ref.slice(0,i0),wq=ref.slice(i0+1);const [w,n]=wq.split('#');const want=norm(w);let c=0;
  for(const x of LINES[id].words)if(norm(x.w)===want&&++c===(+n||1))return x.t;
  throw new Error('palabra no encontrada: '+ref)}
/* ---------- media sin deformar: contenedor con aspect-ratio + <img> object-fit:cover ---------- */
function photo(parent,src,x,y,w,h,pos='center',extra=''){const m=mk(parent,`left:${x}px;top:${y}px;width:${w}px;aspect-ratio:${w}/${h};${extra}`,'','media');
  const i=document.createElement('img');i.src=src;i.alt='';i.style.objectPosition=pos;m.appendChild(i);return m}
/* ---------- dígitos de ancho fijo: los contadores no empujan el layout ---------- */
function counter(el){const cache={};const ls=parseFloat(getComputedStyle(el).letterSpacing)||0;
  const pr=document.createElement('span');pr.style.cssText='position:absolute;visibility:hidden;white-space:pre;letter-spacing:0';el.appendChild(pr);
  const wOf=ch=>{if(cache[ch]==null){el.appendChild(pr);pr.textContent=ch;cache[ch]=pr.getBoundingClientRect().width;pr.remove()}return cache[ch]};
  const dW=Math.max(...[...'0123456789'].map(wOf));[...'.:/S '].forEach(wOf);   // medir todo al construir (con la escena visible)
  return s=>{if(el.dataset.v===s)return;el.dataset.v=s;
    el.innerHTML=[...s].map(ch=>`<span class="dg" style="width:${(/[0-9]/.test(ch)?dW:wOf(ch))+ls}px">${ch}</span>`).join('')}}
/* ---------- frases cinéticas: entran palabra a palabra con la voz y salen completas ---------- */
const LEAD=.12, IN=.32, OUT=.3;
const placed=[];
function statement(parent,spec,lineId,{x=72,y=210,size=88,color=C.bg,acc=C.bl,tOut=null,from=0}={}){
  const box=mk(parent,`left:${x}px;top:${y}px;color:${color};font-size:${size}px`,'','ab st');
  const lw=LINES[lineId].words;let p=from,inAcc=false;const words=[];
  spec.split('/').forEach(rowTxt=>{
    const row=document.createElement('span');row.className='row';box.appendChild(row);
    rowTxt.trim().split(/\s+/).forEach((wd,i,arr)=>{
      let a=inAcc;if(wd.startsWith('|')){a=true;wd=wd.slice(1);inAcc=true}
      const m=wd.match(/\|([.,:;]?)$/);if(m){wd=wd.slice(0,m.index)+m[1];inAcc=false}
      const w=document.createElement('span');w.className='w'+(a?' acc':'');
      const wi=document.createElement('span');wi.className='wi';wi.textContent=wd;if(a)wi.style.color=acc;
      w.appendChild(wi);row.appendChild(w);if(i<arr.length-1)row.appendChild(document.createTextNode(' '));
      const nw=norm(wd.replace(/^3$/,'tres'));let t=null;
      for(let q=p;q<Math.min(lw.length,p+6);q++){const lv=norm(lw[q].w);if(lv===nw||(nw.length>=3&&lv.startsWith(nw))){t=lw[q].t;p=q+1;break}}
      words.push({wi,t});
    });
  });
  words.forEach((w,i)=>{if(w.t==null)w.t=(i?words[i-1].t:LINES[lineId].t)+.12});
  const tIn=words[0].t-LEAD,last=words[words.length-1].t;
  const tEnd=tOut==null?1e9:tOut+OUT+.012*words.length;
  if(tOut!=null&&tOut<last+.25)console.warn(`[sync] "${spec}" sale antes de terminar de decirse`);
  placed.push({parent,y,tIn,tEnd,spec});
  on(t=>{words.forEach((w,i)=>{let yy=(1-k(t,w.t-LEAD,IN))*130;
    if(tOut!=null)yy-=k(t,tOut+i*.012,OUT)*130;
    w.wi.style.transform=`translateY(${yy}%)`});
    box.style.visibility=(t<tIn||t>=tEnd)?'hidden':'visible'});
  return {box,words};
}
function assertNoStacking(){
  for(const a of placed)for(const b of placed)if(a!==b&&a.parent===b.parent&&Math.abs(a.y-b.y)<200&&a.tIn<b.tIn&&a.tEnd>b.tIn)

/* ---------- cortinas por clip-path y apariciones por transform/opacity (sin mover el layout) ---------- */
function wipe(el,t0,d=.45,dir='up'){on(t=>{const p=k(t,t0,d);

function appear(el,t0,d=.3){on(t=>{const p=k(t,t0,d);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*24}px)`;el.style.visibility=p<=0?'hidden':'visible'})}
