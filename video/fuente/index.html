<body><div id="stage"></div>
<script>
const W=1080,H=1920, P='#EEF2EA', N='#03071F', R='#FF1E0F';
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;          // precise snap ease
const k=(t,a,d=.45)=>E(seg(t,a,a+d));
const lerp=(a,b,x)=>a+(b-a)*x;
function mk(parent,css='',html='',cls='ab'){const e=document.createElement('div');e.className=cls;e.style.cssText=css;e.innerHTML=html;parent.appendChild(e);return e}
const updaters=[];
const on=f=>updaters.push(f);

/* ---------- kinetic statement: words rise out of a clip, leave upward ---------- */
// spec: rows separated by '/', accent words wrapped in |..|
function statement(parent,spec,t0,dur,{x=72,y=210,size=88,color=N,acc=R,tOut=null,spread=.85}={}){
  const box=mk(parent,`left:${x}px;top:${y}px;color:${color};font-size:${size}px`,'' ,'ab st');
  let inAcc=false; const words=[];
  spec.split('/').forEach(rowTxt=>{
    const row=document.createElement('span');row.className='row';box.appendChild(row);
    rowTxt.trim().split(/\s+/).forEach((wd,i,arr)=>{
      let a=inAcc; if(wd.startsWith('|')){a=true;wd=wd.slice(1);inAcc=true}
      const m=wd.match(/\|([.,:;]?)$/);if(m){wd=wd.slice(0,m.index)+m[1];inAcc=false}
      const w=document.createElement('span');w.className='w'+(a?' acc':'');
      const wi=document.createElement('span');wi.className='wi';wi.textContent=wd;if(a)wi.style.color=acc;
      w.appendChild(wi);row.appendChild(w);if(i<arr.length-1)row.appendChild(document.createTextNode(' '));
      words.push({wi,len:wd.length+1});
    });
  });
  const tot=words.reduce((s,w)=>s+w.len,0);let c=0;
  words.forEach(w=>{w.t=t0+dur*spread*(c/tot);c+=w.len});
  on(t=>{words.forEach((w,i)=>{let y=(1-k(t,w.t,.32))*112;
    if(tOut!=null)y-=k(t,tOut+i*.012,.3)*112;
    w.wi.style.transform=`translateY(${y}%)`})});
  return {box,words,at:i=>words[i].t};
}
/* ---------- wipe-in panel (clip from bottom) ---------- */
function wipe(el,t0,d=.45,dir='up'){on(t=>{const p=k(t,t0,d);
  el.style.clipPath=dir==='up'?`inset(${(1-p)*100}% 0 0 0)`:dir==='left'?`inset(0 0 0 ${(1-p)*100}%)`:`inset(0 ${(1-p)*100}% 0 0)`;})}
/* ---------- chapter shells ---------- */
let TL;
function chapter(i){
  const c=TL.chapters[i], nx=TL.chapters[i+1];
  const bg=c.bg==='page'?P:c.bg==='navy'?N:R, fg=c.bg==='page'?N:P;
  const el=mk(stage,`background:${bg};color:${fg}`,'','ch');
  // grid: 6 columns, faint
  for(let j=0;j<=6;j++)mk(el,`left:${72+j*156}px;top:150px;width:1px;height:1640px;background:${fg};opacity:.07`);
  mk(el,`left:72px;top:150px;width:936px;height:1px;background:${fg};opacity:.25`);
  mk(el,`left:72px;top:1790px;width:936px;height:1px;background:${fg};opacity:.25`);
  const hdr=mk(el,`left:72px;top:96px;color:${fg}`,`${c.n} · ${c.name}`,'ab mono');
  mk(el,`right:72px;top:96px;color:${fg}`,'MERIDIAN DIGITAL ©','ab mono');
  mk(el,`left:72px;top:1812px;color:${fg};opacity:.6`,'PÁGINAS WEB · VENEZUELA','ab mono');
  const tc=mk(el,`right:72px;top:1812px;color:${fg};opacity:.6`,'','ab mono');
  const end=nx?nx.t+.5:1e9;
  on(t=>{el.style.display=(t>=c.t-.3&&t<end)?'block':'none';
    if(i>0){const p=k(t,c.t-.25,.5);el.style.clipPath=`inset(${(1-p)*100}% 0 0 0)`}
    tc.textContent=`00:${String(Math.floor(t)).padStart(2,'0')} / 00:${TL.dur}`;
    hdr.style.clipPath=`inset(0 ${(1-k(t,c.t,.4))*100}% 0 0)`;});
  return el;
}
/* ---------- small icons ---------- */

const bubble=(c,s=56)=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56"><path d="M28 6a22 22 0 0 0-19 33l-3 11 11-3A22 22 0 1 0 28 6z" fill="none" stroke="${c}" stroke-width="4.5"/><path d="M20 22c0 8 6 14 14 14l3-3-5-3-2 2c-3-1-5-3-6-6l2-2-3-5z" fill="${c}"/></svg>`;
const search=(c)=>`<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="14" cy="14" r="10" fill="none" stroke="${c}" stroke-width="4"/><path d="M22 22l9 9" stroke="${c}" stroke-width="4"/></svg>`;

 const res=[['Panadería La Esquina','tu competencia'],['Dulce Horno','tu competencia'],['Pan & Café Central','tu competencia']];

 const D=mk(ch,`left:0;top:150px;width:1080px;height:1640px;background:${N}`);

{const ch=chapter(2);
